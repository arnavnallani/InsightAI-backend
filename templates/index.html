<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CourtIQ - AI Tennis Coach</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            text-align: center;
            color: white;
            padding: 40px;
        }
        
        h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        
        p {
            font-size: 1.3rem;
            margin-bottom: 40px;
            opacity: 0.9;
        }
        
        .cta-button {
            display: inline-block;
            padding: 18px 50px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(0,0,0,0.3);
        }
        
        .features {
            margin-top: 60px;
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .feature {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            width: 200px;
        }
        
        .feature-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎾 CourtIQ</h1>
        <p>AI-Powered Tennis Match Analysis</p>
        <a href="/upload" class="cta-button">Upload Your Match Video →</a>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">📹</div>
                <h3>Upload Video</h3>
                <p>Upload your match recording</p>
            </div>
            <div class="feature">
                <div class="feature-icon">🎯</div>
                <h3>Court Calibration</h3>
                <p>Click 4 corners to calibrate</p>
            </div>
            <div class="feature">
                <div class="feature-icon">🤖</div>
                <h3>AI Analysis</h3>
                <p>7 advanced analytics features</p>
            </div>
            <div class="feature">
                <div class="feature-icon">📊</div>
                <h3>View Results</h3>
                <p>Interactive visualizations</p>
            </div>
        </div>
    </div>
</body>
</html>
